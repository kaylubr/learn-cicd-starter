name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup go environment
        uses: actions/setup-go@v6
        with:
          go-version: "1.27..1"
      
      - name: Run build for deployment
        run: ./scripts/buildprod.sh